# Argo CD Application used for the local demo.
# Source of truth = the in-cluster Gitea (the GitHub repo had not been pushed yet).
# Same path and values as application.yaml - only repoURL differs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lostfound
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.git-server.svc.cluster.local:3000/gitops/devops-assignment.git
    targetRevision: main
    path: final-devops-project/helm/lostfound
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lostfound
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # same labels as kubernetes/namespace.yaml, so Argo CD owns the namespace too
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: lostfound
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
