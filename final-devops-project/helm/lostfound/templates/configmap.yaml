apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lostfound.fullname" . }}-config
  labels:
    {{- include "lostfound.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CAMPUS_NOTICE: {{ .Values.config.campusNotice | quote }}
  DB_HOST: {{ include "lostfound.fullname" . }}-db
  DB_PORT: "5432"
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
