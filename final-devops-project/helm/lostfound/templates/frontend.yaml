apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lostfound.fullname" . }}-frontend
  labels:
    {{- include "lostfound.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "lostfound.selector" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lostfound.selector" (list . "frontend") | nindent 8 }}
    spec:
      securityContext:
        {{- include "lostfound.podSecurity" . | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "lostfound.image" (list . .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # only used by nginx's own /api proxy; the Ingress normally sends /api to the backend directly
            - name: BACKEND_URL
              value: http://{{ include "lostfound.fullname" . }}-backend:8000
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "lostfound.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # nginx needs somewhere writable for its pid, temp files and the rendered config
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /tmp }
            - { name: confd, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: confd, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lostfound.fullname" . }}-frontend
  labels:
    {{- include "lostfound.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lostfound.selector" (list . "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
