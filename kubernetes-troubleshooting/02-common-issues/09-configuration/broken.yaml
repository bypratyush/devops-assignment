# Configuration issues - the image is fine, the cluster is fine, the YAML is wrong.
#
#  notifier    : env var from a ConfigMap KEY that does not exist (case mismatch)
#                -> CreateContainerConfigError, the container is never created
#  web-gateway : `command` overridden with a script that is not in the image
#                -> StartError / RunContainerError, then CrashLoopBackOff
apiVersion: v1
kind: ConfigMap
metadata:
  name: notifier-config
  namespace: s14-issues
data:
  smtp_host: "mail.internal.example"
  smtp_port: "587"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: notifier }
  template:
    metadata:
      labels: { app: notifier, issue: config }
    spec:
      containers:
        - name: notifier
          image: busybox:1.36
          command: ["sh", "-c", "echo notifier using $SMTP_HOST:$SMTP_PORT; sleep 3600"]
          env:
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: notifier-config
                  key: SMTP_HOST          # BUG: the key is 'smtp_host' (keys are case-sensitive)
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: notifier-config
                  key: smtp_port
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: web-gateway }
  template:
    metadata:
      labels: { app: web-gateway, issue: config }
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          command: ["/app/start.sh"]      # BUG: copied from another service; not in this image
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
