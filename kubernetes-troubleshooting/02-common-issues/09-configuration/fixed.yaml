# Fixed: reference the key that actually exists, and stop overriding the
# image's own entrypoint/command.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notifier-config
  namespace: s14-issues
data:
  smtp_host: "mail.internal.example"
  smtp_port: "587"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: notifier }
  template:
    metadata:
      labels: { app: notifier, issue: config }
    spec:
      containers:
        - name: notifier
          image: busybox:1.36
          command: ["sh", "-c", "echo notifier using $SMTP_HOST:$SMTP_PORT; sleep 3600"]
          env:
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: notifier-config
                  key: smtp_host          # FIX: exact key name
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: notifier-config
                  key: smtp_port
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: web-gateway }
  template:
    metadata:
      labels: { app: web-gateway, issue: config }
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          # FIX: no command override - the image's ENTRYPOINT/CMD start nginx
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
