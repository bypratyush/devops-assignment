# CrashLoopBackOff - two Deployments that crash for two DIFFERENT reasons.
#
#  orders-worker : the app itself exits 1 because a required env var is missing.
#                  The answer is in `kubectl logs --previous`.
#  thumbnailer   : the kernel kills it for using more memory than its limit
#                  (OOMKilled, exit 137). The logs are useless here; the answer
#                  is in `kubectl describe` -> Last State.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-worker }
  template:
    metadata:
      labels: { app: orders-worker, issue: crashloop }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "orders-worker v1.4 starting"
              echo "reading configuration from environment"
              for i in 1 2 3; do
                [ -n "$QUEUE_URL" ] && break
                echo "QUEUE_URL not set yet, retry $i/3 in 3s"; sleep 3
              done
              if [ -z "$QUEUE_URL" ]; then
                echo "FATAL: QUEUE_URL is not set - cannot connect to the order queue" >&2
                exit 1
              fi
              echo "connected to $QUEUE_URL"
              while true; do echo "polling $QUEUE_URL for new orders"; sleep 10; done
          # BUG: no env section - QUEUE_URL is never provided
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thumbnailer
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: thumbnailer }
  template:
    metadata:
      labels: { app: thumbnailer, issue: crashloop }
    spec:
      containers:
        - name: thumbnailer
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "thumbnailer starting, warming a 150 MB image cache"
              # `tail` on input with no newlines has to buffer all of it in RAM
              head -c 150m /dev/zero | tail > /dev/null
              echo "cache warm, serving"
              while true; do sleep 10; done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }   # BUG: 64Mi limit, needs ~150Mi
