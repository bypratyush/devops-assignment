# Pod networking - a NetworkPolicy silently drops traffic it was meant to allow.
#
# ledger only accepts traffic from billing pods (lockdown + allow policy).
# BUG: the allow rule says port 80 - the SERVICE port - but NetworkPolicy
# ports are matched against the POD's port (8080), because kube-proxy has
# already rewritten the destination by the time the policy is evaluated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: ledger }
  template:
    metadata:
      labels: { app: ledger, issue: netpol }
    spec:
      containers:
        - name: ledger
          image: nginxdemos/nginx-hello:plain-text
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: s14-issues
spec:
  selector: { app: ledger }
  ports: [{ port: 80, targetPort: http }]
---
# 1. lock the ledger down: it selects the ledger pods and allows nothing
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-lockdown
  namespace: s14-issues
spec:
  podSelector:
    matchLabels: { app: ledger }
  policyTypes: [Ingress]
---
# 2. ...then open it for billing only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-allow-billing
  namespace: s14-issues
spec:
  podSelector:
    matchLabels: { app: ledger }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: billing }
      ports:
        - protocol: TCP
          port: 80                 # BUG: Service port, not the pod's 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: billing
  namespace: s14-issues
  labels: { app: billing, issue: netpol }
spec:
  containers:
    - name: client
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 100m, memory: 32Mi }
---
# a pod that should NEVER reach the ledger - used to prove the fix keeps the policy
apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: s14-issues
  labels: { app: intruder, issue: netpol }
spec:
  containers:
    - name: client
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 100m, memory: 32Mi }
