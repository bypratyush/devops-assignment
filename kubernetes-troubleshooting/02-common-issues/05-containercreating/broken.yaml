# ContainerCreating (stuck) - the pod is scheduled, but the kubelet cannot
# build its volumes: the ConfigMap and Secret it mounts were never created
# (they live in a separate manifest that the deploy step forgot to apply).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-service
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: invoice-service }
  template:
    metadata:
      labels: { app: invoice-service, issue: containercreating }
    spec:
      containers:
        - name: invoice
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "invoice-service starting"
              echo "settings: $(cat /etc/invoice/settings.properties | tr '\n' ' ')"
              echo "db password file present: $(test -s /etc/invoice-db/password && echo yes)"
              while true; do sleep 30; done
          volumeMounts:
            - { name: config, mountPath: /etc/invoice, readOnly: true }
            - { name: db-creds, mountPath: /etc/invoice-db, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      volumes:
        - name: config
          configMap:
            name: invoice-config        # BUG: this ConfigMap does not exist
        - name: db-creds
          secret:
            secretName: invoice-db      # BUG: this Secret does not exist
