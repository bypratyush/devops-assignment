# Fixed: create the ConfigMap and Secret the Deployment depends on.
# The Deployment itself is unchanged - the kubelet keeps retrying the mount
# and the SAME pod starts on its own once the objects exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: invoice-config
  namespace: s14-issues
data:
  settings.properties: |
    currency=INR
    tax.rate=18
---
apiVersion: v1
kind: Secret
metadata:
  name: invoice-db
  namespace: s14-issues
type: Opaque
stringData:
  password: "lab-only-not-a-real-password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-service
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: invoice-service }
  template:
    metadata:
      labels: { app: invoice-service, issue: containercreating }
    spec:
      containers:
        - name: invoice
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "invoice-service starting"
              echo "settings: $(cat /etc/invoice/settings.properties | tr '\n' ' ')"
              echo "db password file present: $(test -s /etc/invoice-db/password && echo yes)"
              while true; do sleep 30; done
          volumeMounts:
            - { name: config, mountPath: /etc/invoice, readOnly: true }
            - { name: db-creds, mountPath: /etc/invoice-db, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      volumes:
        - name: config
          configMap:
            name: invoice-config
        - name: db-creds
          secret:
            secretName: invoice-db
