# Pending - the scheduler cannot find ANY node for these pods.
#
#  report-builder : asks for 64 CPUs; every node here has 15 allocatable.
#  search-indexer : nodeSelector disktype=ssd, a label no node in this cluster has
#                   (copied from a cluster where the SSD nodes were labelled).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-builder
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: report-builder }
  template:
    metadata:
      labels: { app: report-builder, issue: pending }
    spec:
      containers:
        - name: builder
          image: busybox:1.36
          command: ["sh", "-c", "echo building reports; sleep 3600"]
          resources:
            requests: { cpu: "64", memory: 32Mi }     # BUG: 64 cores
            limits:   { cpu: "64", memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-indexer
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels: { app: search-indexer }
  template:
    metadata:
      labels: { app: search-indexer, issue: pending }
    spec:
      nodeSelector:
        disktype: ssd                                # BUG: no node has this label
      containers:
        - name: indexer
          image: busybox:1.36
          command: ["sh", "-c", "echo indexing; sleep 3600"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
