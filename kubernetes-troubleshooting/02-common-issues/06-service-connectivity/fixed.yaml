# Fixed: selector matches the pod labels, and targetPort uses the container's
# NAMED port, so a future port change in the Deployment cannot break it again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: s14-issues
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog-api }
  template:
    metadata:
      labels: { app: catalog-api, issue: svc }
    spec:
      containers:
        - name: api
          image: nginxdemos/nginx-hello:plain-text
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: s14-issues
spec:
  selector:
    app: catalog-api        # FIX 1
  ports:
    - port: 80
      targetPort: http      # FIX 2: named port -> 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: shop-frontend
  namespace: s14-issues
  labels: { app: shop-frontend, issue: svc }
spec:
  containers:
    - name: client
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 100m, memory: 32Mi }
