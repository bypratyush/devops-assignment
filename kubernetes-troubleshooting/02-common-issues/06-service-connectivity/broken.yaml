# Service connectivity - the shop frontend cannot reach the catalog API.
# Two bugs stacked on top of each other, as they often are:
#   1. Service selector app=catalog, but the pods are labelled app=catalog-api
#   2. Service targetPort 80, but the container listens on 8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: s14-issues
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog-api }
  template:
    metadata:
      labels: { app: catalog-api, issue: svc }
    spec:
      containers:
        - name: api
          image: nginxdemos/nginx-hello:plain-text    # listens on 8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: s14-issues
spec:
  selector:
    app: catalog            # BUG 1: pods are labelled app=catalog-api
  ports:
    - port: 80
      targetPort: 80        # BUG 2: the container listens on 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: shop-frontend
  namespace: s14-issues
  labels: { app: shop-frontend, issue: svc }
spec:
  containers:
    - name: client
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 100m, memory: 32Mi }
