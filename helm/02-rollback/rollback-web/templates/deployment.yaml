apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rollback-web.fullname" . }}
  labels:
    {{- include "rollback-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rollback-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rollback-web.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods whenever the page content changes.
        checksum/page: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            # Keep serving for a few seconds after the pod is marked for
            # deletion, so kube-proxy can drop it from the Service first.
            # Without this, requests right after an upgrade got "connection
            # refused" (see README notes).
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: {{ include "rollback-web.fullname" . }}-page
