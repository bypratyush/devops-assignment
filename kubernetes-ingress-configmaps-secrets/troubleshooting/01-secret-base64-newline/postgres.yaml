# The database side - correct and never touched during the exercise.
# Its password is set with stringData, so there is no base64 step to get wrong.
apiVersion: v1
kind: Secret
metadata:
  name: db-server-secret
  namespace: s12-trouble
type: Opaque
stringData:
  POSTGRES_PASSWORD: mypassword
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: s12-trouble
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: yatri_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-server-secret, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "yatri_admin"]
            periodSeconds: 3
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: s12-trouble
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
