# FIXED: the Deployment asks for the key that exists (db_host).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
  namespace: s12-trouble
data:
  db_host: postgres.s12-trouble.svc.cluster.local
  log_level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settings-app
  namespace: s12-trouble
spec:
  replicas: 1
  selector:
    matchLabels: { app: settings-app }
  template:
    metadata:
      labels: { app: settings-app }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo DB_HOST=$DB_HOST LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: app-settings, key: db_host }
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: app-settings, key: log_level }
          resources:
            requests: { cpu: "5m", memory: "8Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
