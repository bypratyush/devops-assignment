apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # simple key/value pairs, consumed as environment variables
  APP_ENV: "production"
  LOG_LEVEL: "info"
  FEATURE_FLAG: "enabled"
  # a whole file, consumed by mounting it as a volume
  app.properties: |
    server.port=8080
    server.timeout=30
    cache.enabled=true
