# One entry point, routing by HOST and by PATH to different Services.
# This is L7 (HTTP) routing - a Service alone cannot do this.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    # rule 1: route by HOSTNAME
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: config-demo-svc
                port:
                  number: 80
    - host: second.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: second-app-svc
                port:
                  number: 80
    # rule 2: route by PATH on a shared host
    - host: shared.local
      http:
        paths:
          - path: /one
            pathType: Prefix
            backend:
              service:
                name: config-demo-svc
                port:
                  number: 80
          - path: /two
            pathType: Prefix
            backend:
              service:
                name: second-app-svc
                port:
                  number: 80
