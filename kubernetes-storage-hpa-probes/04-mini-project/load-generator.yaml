# The course's load generator as a manifest: busybox fetching the Service in a
# tight loop. Delete the pod to stop the load.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: production-webapp
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c", "while true; do wget -q -O- http://web-service >/dev/null; done"]
