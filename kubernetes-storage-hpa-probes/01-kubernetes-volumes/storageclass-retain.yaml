# My own StorageClass: same local-path provisioner as 'standard', but the
# volumes it creates are RETAINED when their claim is deleted.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: s13-local-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s13-retain-pvc
  namespace: s13-volumes
spec:
  storageClassName: s13-local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: retain-demo
  namespace: s13-volumes
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'important data' > /data/keep.txt && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "50m", memory: "32Mi" }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: s13-retain-pvc
