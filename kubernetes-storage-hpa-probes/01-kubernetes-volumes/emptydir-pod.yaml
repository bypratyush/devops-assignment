# emptyDir: scratch space that lives exactly as long as the POD.
# Two containers share one emptyDir - a writer appends lines, nginx serves them.
# A second emptyDir uses medium: Memory, i.e. a tmpfs backed by RAM.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: s13-volumes
  labels:
    app: emptydir-demo
spec:
  terminationGracePeriodSeconds: 2      # busybox sh ignores SIGTERM; do not wait 30s
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "pod started $(date +%T) on $(hostname)" >> /shared/index.html
          while true; do
            echo "writer tick $(date +%T)" >> /shared/index.html
            sleep 5
          done
      volumeMounts:
        - name: shared
          mountPath: /shared
        - name: ram-scratch
          mountPath: /scratch
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "50m", memory: "32Mi" }
    - name: web
      image: nginx:1.25-alpine
      volumeMounts:
        - name: shared                       # same volume, different path
          mountPath: /usr/share/nginx/html
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "50m", memory: "64Mi" }
  volumes:
    - name: shared
      emptyDir: {}                            # on the node's disk
    - name: ram-scratch
      emptyDir:
        medium: Memory                        # tmpfs, counts against memory
        sizeLimit: 16Mi
