# The first CONSUMER of the claim. With volumeBindingMode: WaitForFirstConsumer
# the PV is only created once this pod is scheduled, on the pod's node.
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-demo
  namespace: s13-volumes
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "50m", memory: "32Mi" }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: s13-dynamic-pvc
