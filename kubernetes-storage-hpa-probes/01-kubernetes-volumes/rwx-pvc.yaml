# Access modes are a promise the STORAGE must keep. local-path is a directory on
# one node, so it cannot offer ReadWriteMany - and it says so.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s13-rwx-pvc
  namespace: s13-volumes
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: rwx-demo
  namespace: s13-volumes
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "50m", memory: "32Mi" }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: s13-rwx-pvc
