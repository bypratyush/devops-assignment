# Load generator: two busybox pods hitting the service in a tight loop.
# Two replicas = two requests in flight at all times.
# Stop the load with:  kubectl -n s13-hpa scale deployment load-generator --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: s13-hpa
  labels:
    app: load-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "hammering http://cpu-app ..."
              while true; do
                wget -q -O /dev/null http://cpu-app || sleep 1
              done
          resources:
            requests: { cpu: "50m", memory: "16Mi" }
            limits:   { cpu: "200m", memory: "32Mi" }
