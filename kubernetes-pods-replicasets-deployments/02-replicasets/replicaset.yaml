apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-rs
  labels:
    app: web-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-rs          # which pods this ReplicaSet owns
  template:
    metadata:
      labels:
        app: web-rs        # pods are stamped with this, so the selector matches
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
