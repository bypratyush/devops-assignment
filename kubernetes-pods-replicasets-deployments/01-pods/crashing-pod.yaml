# Deliberately broken: the process exits immediately with an error.
# Used to demonstrate CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: crashing-pod
spec:
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting...'; echo 'fatal: cannot connect to database' >&2; exit 1"]
