# Two containers in ONE pod: they share a network namespace (same IP, can talk
# over localhost) and a volume. This is the sidecar pattern.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-pod
  labels:
    app: sidecar-demo
spec:
  volumes:
    - name: shared-data
      emptyDir: {}
  containers:
    # main container: serves whatever is in the shared volume
    - name: web
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
    # sidecar: writes into that same volume every 5 seconds
    - name: content-writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            echo "<h1>Generated by the sidecar at $(date)</h1>" > /data/index.html
            sleep 5
          done
      volumeMounts:
        - name: shared-data
          mountPath: /data
