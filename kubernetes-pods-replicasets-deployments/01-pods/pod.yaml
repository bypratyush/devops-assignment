apiVersion: v1
kind: Pod
metadata:
  name: standalone-pod
  labels:
    app: demo-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
