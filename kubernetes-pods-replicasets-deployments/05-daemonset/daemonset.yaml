# A DaemonSet runs exactly ONE pod on every eligible node - no replica count.
# The scheduler adds a pod when a node joins and removes it when a node leaves.
# Typical real uses: log collectors (Fluent Bit), metrics agents (node-exporter),
# CNI plugins, storage drivers.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  labels:
    app: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - "echo \"agent started on node $NODE_NAME\"; while true; do sleep 30; done"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "64Mi" }
