# Restricted DaemonSet: only nodes labelled disktype=ssd get a pod.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent-ssd
  labels:
    app: node-agent-ssd
spec:
  selector:
    matchLabels:
      app: node-agent-ssd
  template:
    metadata:
      labels:
        app: node-agent-ssd
    spec:
      nodeSelector:
        disktype: ssd
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "64Mi" }
