server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    server_tokens off;

    # Single-page app: unknown paths fall back to index.html so client-side
    # routes survive a page refresh instead of returning nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in every asset file name, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
