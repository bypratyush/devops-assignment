<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello World - Nginx</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #eef7f2; color: #14261c; margin: 0; }
    main { max-width: 640px; margin: 60px auto; padding: 32px 40px; background: #fff;
           border-top: 6px solid #009639; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; color: #00782e; }
    td { padding: 4px 16px 4px 0; } td:first-child { color: #667; }
    footer { margin-top: 24px; font-size: 14px; color: #556; }
  </style>
</head>
<body>
  <main>
    <h1>Hello World from Nginx</h1>
    <p>A static page served by nginx inside a Docker container.</p>
    <table>
      <tr><td>Server</td><td>nginx 1.30 on Alpine</td></tr>
      <tr><td>Document root</td><td>/usr/share/nginx/html</td></tr>
      <tr><td>Health check</td><td><code>/healthz</code> answered by nginx itself</td></tr>
    </table>
    <footer>Built by Pratyush Mohanty (Roll No. 24BCS10238)</footer>
  </main>
</body>
</html>
