server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Do not advertise the exact nginx version in headers and error pages.
    server_tokens off;

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Cheap liveness endpoint that never touches the disk.
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
