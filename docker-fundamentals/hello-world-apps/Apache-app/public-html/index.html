<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello World - Apache</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8f1f4; color: #2a1820; margin: 0; }
    main { max-width: 640px; margin: 60px auto; padding: 32px 40px; background: #fff;
           border-top: 6px solid #a3195b; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; color: #a3195b; }
    td { padding: 4px 16px 4px 0; } td:first-child { color: #667; }
    footer { margin-top: 24px; font-size: 14px; color: #556; }
  </style>
</head>
<body>
  <main>
    <h1>Hello World from Apache</h1>
    <p>A static page served by the Apache HTTP Server (httpd) inside a Docker container.</p>
    <table>
      <tr><td>Server</td><td>httpd 2.4 on Alpine</td></tr>
      <tr><td>Document root</td><td>/usr/local/apache2/htdocs</td></tr>
      <tr><td>Listening on</td><td>port 80 in the container</td></tr>
    </table>
    <footer>Built by Pratyush Mohanty (Roll No. 24BCS10238)</footer>
  </main>
</body>
</html>
